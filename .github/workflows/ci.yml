name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install root project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Preserve original Week 3 tests
        run: python scripts/check_week3_tests.py
      - name: Week 3 regression and new Week 4 foundation tests
        run: python -m pytest -q
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  lab07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lab 7 starter
        working-directory: lab07/starter
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Lab 7 starter tests
        working-directory: lab07/starter
        run: python -m pytest -q
      - name: Lab 7 practice tests
        if: ${{ !cancelled() }}
        working-directory: lab07/practice
        run: python -m pytest -q
