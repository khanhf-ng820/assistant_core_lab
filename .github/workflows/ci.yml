name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  lab04:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and API
        run: |
          python -m pip install -r lab04/starter/requirements.txt
          python -m pip install -e . -e ./lab04/starter
      - name: Practice P1-P5
        working-directory: lab04/practice
        run: python -m pytest -q test_hello_api.py
      - name: Full API and starter tests
        working-directory: lab04/starter
        run: python -m pytest -q tests
      - name: API lint and format
        run: |
          ruff check --config lab04/starter/pyproject.toml lab04/starter/src/assistant_api lab04/starter/tests lab04/practice
          ruff format --check --config lab04/starter/pyproject.toml lab04/starter/src/assistant_api lab04/starter/tests lab04/practice
